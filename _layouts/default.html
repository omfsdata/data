<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="{{ '/' | relative_url }}">OMFS Data<span></span></a>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}"        class="{% if page.nav == 'map' %}active{% endif %}">Program Map</a>
      <a href="{{ '/analysis/' | relative_url }}" class="{% if page.nav == 'analysis' %}active{% endif %}">SDN Match Analysis</a>
      <a href="{{ '/predictor/' | relative_url }}"    class="{% if page.nav == 'predictor' %}active{% endif %}">Predictor</a>
      <a href="{{ '/contribute/' | relative_url }}"    class="{% if page.nav == 'contribute' %}active{% endif %}">Contribute Data</a>
      <a href="{{ '/feedback/' | relative_url }}"    class="{% if page.nav == 'feedback' %}active{% endif %}">Feedback</a>
      <a href="{{ '/about/' | relative_url }}"    class="{% if page.nav == 'about' %}active{% endif %}">About</a>
    </div>
  </nav>

  <main class="{{ page.container }}">
    {{ content }}
  </main>

  <div class="footer">{{ site.footer_text }}</div>

  <script>
    // The nav links scroll sideways on narrow screens (see site.css). Bring the current
    // page's link into view, and only fade the trailing edge while there is more to see.
    (function () {
      var links = document.querySelector(".site-nav .nav-links");
      if (!links) return;
      function sync() {
        var more = links.scrollWidth > links.clientWidth + 1;
        links.classList.toggle("scrollable", more);
        links.classList.toggle("scroll-end",
          links.scrollLeft + links.clientWidth >= links.scrollWidth - 1);
      }
      var active = links.querySelector("a.active");
      // block:"nearest" so this never scrolls the page itself, only the strip.
      if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
      sync();
      links.addEventListener("scroll", sync, { passive: true });
      window.addEventListener("resize", sync);
    })();
  </script>
</body>
</html>
